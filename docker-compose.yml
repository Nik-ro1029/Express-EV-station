services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-evadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-evpass123}
    volumes:
      - mongo_data:/data/db          # keeps your data between restarts
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports published: only the backend can reach the database.

  backend:                           # Flask API
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_USER: ${MONGO_USER:-evadmin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-evpass123}
      MONGO_DB: ${MONGO_DB:-ev_station}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5001:5000"                  # optional: test the API at http://localhost:5001/api/health

  frontend:                          # Node.js + Express
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-$}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:3000"                  # open http://localhost:8000

volumes:
  mongo_data:
